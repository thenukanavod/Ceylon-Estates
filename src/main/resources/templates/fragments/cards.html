<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Listing card used on the homepage carousel, the search results and "similar listings".
     Photo if the listing has one, otherwise the same coloured placeholder the homepage always used.
     (If a photo file is missing, the gradient behind it simply shows through.)
     Usage: <div th:replace="~{fragments/cards :: card(${p})}"></div> -->
<div th:fragment="card(p)" class="listing-card-inner">
    <div class="listing-thumb"
         th:style="${p.coverImageUrl != null} ? ('background-image: url(' + @{${p.coverImageUrl}} + '), ' + ${p.thumbGradient}) : ('background: ' + ${p.thumbGradient})">
        <span class="listing-thumb-tag" th:text="#{${p.tagMessageKey}}">HOUSE</span>
        <!-- Save / unsave (signed-out visitors are sent to the login page) -->
        <form th:action="@{/saved/{id}/toggle(id=${p.id})}" method="post" class="heart-form">
            <button type="submit" class="heart-btn" th:classappend="${savedIds != null and savedIds.contains(p.id)} ? 'on'"
                    th:title="${savedIds != null and savedIds.contains(p.id)} ? #{saved.unsave} : #{saved.save}">
                <i th:class="${savedIds != null and savedIds.contains(p.id)} ? 'bi bi-heart-fill' : 'bi bi-heart'"></i>
            </button>
        </form>
    </div>
    <div class="listing-body">
        <h5 class="fw-bold mb-1" th:text="${p.title}">Property title</h5>
        <div class="text-muted small mb-2"><i class="bi bi-geo-alt-fill"></i> <span th:text="${p.locationLabel}">Colombo</span></div>
        <div class="fw-bold" th:text="${p.priceFormatted}">8,200,000 LKR</div>
        <div class="text-muted small fst-italic mb-2" th:text="#{${p.priceNoteKey}}">FIXED PRICE</div>
        <hr>
        <div class="d-flex justify-content-between align-items-center">
            <a th:href="@{/properties/{id}(id=${p.id})}" class="small fw-semibold text-decoration-none stretched-link">
                <span th:text="#{${p.exploreMessageKey}}">Explore House</span> <i class="bi bi-arrow-right"></i>
            </a>
            <!-- How many times this listing has been opened; not shown once it is sold or rented -->
            <span class="small text-muted" th:if="${p.status.name() != 'SOLD' and p.status.name() != 'RENTED'}"
                  th:title="#{listing.views}">
                <i class="bi bi-eye"></i> <span th:text="${p.viewCount}">0</span>
            </span>
        </div>
    </div>
</div>

<!-- Card for the Completed Projects library: same look, with a Sold / Rented ribbon.
     Usage: <div th:replace="~{fragments/cards :: projectCard(${p})}"></div> -->
<div th:fragment="projectCard(p)" class="listing-card-inner project-card">
    <div class="listing-thumb project-thumb"
         th:style="${p.coverImageUrl != null} ? ('background-image: url(' + @{${p.coverImageUrl}} + '), ' + ${p.thumbGradient}) : ('background: ' + ${p.thumbGradient})">
        <span class="listing-thumb-tag" th:text="#{${p.tagMessageKey}}">HOUSE</span>
        <span class="project-ribbon" th:text="${p.forRent} ? #{project.rented} : #{project.sold}">SOLD</span>
    </div>
    <div class="listing-body">
        <h5 class="fw-bold mb-1" th:text="${p.title}">Project title</h5>
        <div class="text-muted small mb-2"><i class="bi bi-geo-alt-fill"></i> <span th:text="${p.locationLabel}">Colombo</span></div>
        <div class="small" th:text="${p.displayInfo}">3 bed, 2 bath</div>
        <hr>
        <a th:href="@{/properties/{id}(id=${p.id})}" class="small fw-semibold text-decoration-none stretched-link">
            <span th:text="#{project.view}">View project</span> <i class="bi bi-arrow-right"></i>
        </a>
    </div>
</div>

</body>
</html>
