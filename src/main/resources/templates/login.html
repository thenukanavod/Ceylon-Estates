<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Login</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div class="auth-page">
        <div class="auth-card">

            <img class="auth-logo" th:src="@{/images/logo-icon-v3.png}" alt="Ceylon Estates">
            <h1 class="auth-title" th:text="#{login.welcomeBack}">Welcome Back</h1>
            <p class="auth-subtitle" th:text="#{login.subtitle}">Sign in to continue</p>

            <div class="alert alert-success py-2 small" th:if="${param.registered}" th:text="#{login.registered}"></div>
            <div class="alert alert-success py-2 small" th:if="${param.resetSuccess}" th:text="#{login.resetSuccess}"></div>
            <div class="alert alert-success py-2 small" th:if="${param.profileUpdated}" th:text="#{login.profileUpdated}"></div>
            <div class="alert alert-danger py-2 small" th:if="${param.error}" th:text="#{login.error}"></div>
            <div class="alert alert-success py-2 small" th:if="${param.logout}" th:text="#{login.loggedOut}"></div>

            <form th:action="@{/login}" method="post">

                <div class="auth-field">
                    <i class="bi bi-envelope"></i>
                    <div class="auth-field-content">
                        <div class="auth-field-label" th:text="#{login.username}">Username</div>
                        <input type="text" name="username" th:placeholder="#{login.usernamePlaceholder}" placeholder="Enter your username">
                    </div>
                </div>

                <div class="auth-field">
                    <i class="bi bi-lock"></i>
                    <div class="auth-field-content">
                        <div class="auth-field-label" th:text="#{login.password}">Password</div>
                        <input type="password" id="loginPassword" name="password" th:placeholder="#{login.passwordPlaceholder}" placeholder="Enter your password">
                    </div>
                    <button type="button" class="toggle-password" data-target="loginPassword"><i class="bi bi-eye"></i></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check mb-0">
                        <input type="checkbox" class="form-check-input" name="remember-me" id="rememberMe">
                        <label class="form-check-label small" style="color: rgba(255,255,255,0.6);" for="rememberMe" th:text="#{login.rememberMe}">Remember me</label>
                    </div>
                    <a th:href="@{/forgot-password}" class="small" style="color: rgba(255,255,255,0.6);" th:text="#{login.forgot}">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth-submit" th:text="#{login.submit}">
                    Sign In <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="auth-divider" th:text="#{login.orContinue}">or continue with</div>

            <a th:href="@{/oauth2/authorization/google}" class="btn-provider">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.08-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.97H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
                <span th:text="#{login.googleSignIn}">Continue with Google</span>
                <i class="bi bi-arrow-right ms-auto"></i>
            </a>

            <div class="auth-footer">
                <span th:text="#{login.noAccount}">Don't have an account?</span>
                <a th:href="@{/register}" th:text="#{login.register}">Sign Up</a>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
