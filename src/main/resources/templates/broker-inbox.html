<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Broker inbox</title>
</head>
<body>
<header th:replace="~{fragments/layout :: pageHero(#{inbox.title}, #{inbox.subtitle})}"></header>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="container-xl page-main">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h4 class="fw-bold mb-0">
            <span th:text="${myBroker.name}">Broker</span>
            <span class="badge text-bg-danger ms-1" th:if="${unreadBrokerMessages > 0}" th:text="#{inbox.unreadCount(${unreadBrokerMessages})}">2 unread</span>
        </h4>
        <a th:href="@{/brokers/{id}(id=${myBroker.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-person-badge"></i> <span th:text="#{inbox.viewPublicPage}">View my public page</span></a>
    </div>

    <div class="inbox-list" th:if="${!#lists.isEmpty(inboxMessages)}">
        <div class="inbox-card" th:classappend="${m.unread} ? 'unread'" th:each="m : ${inboxMessages}">

            <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                <div>
                    <span class="fw-semibold" th:text="${m.sender.username}">sender</span>
                    <span class="badge text-bg-danger ms-1" th:if="${m.unread}" th:text="#{inbox.new}">New</span>
                    <div class="small text-muted" th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2026, 10:00</div>
                </div>
                <div class="d-inline-flex gap-1">
                    <form th:if="${m.unread}" th:action="@{/broker/inbox/{id}/read(id=${m.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="#{inbox.markRead}">Mark as read</button>
                    </form>
                    <form th:unless="${m.unread}" th:action="@{/broker/inbox/{id}/unread(id=${m.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="#{inbox.markUnread}">Mark as unread</button>
                    </form>
                    <form th:action="@{/broker/inbox/{id}/delete(id=${m.id})}" method="post"
                          th:attr="onsubmit='return confirm(\'' + #{inbox.confirmDelete} + '\');'">
                        <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{inbox.delete}"><i class="bi bi-trash"></i></button>
                    </form>
                </div>
            </div>

            <p class="inbox-body" th:if="${m.body != null}" th:text="${m.body}">Message text</p>

            <!-- A listing the sender shared -->
            <a class="inbox-listing" th:if="${m.property != null}" th:href="@{/properties/{id}(id=${m.property.id})}">
                <div class="inbox-listing-thumb"
                     th:style="${m.property.coverImageUrl != null} ? ('background-image: url(' + @{${m.property.coverImageUrl}} + '), ' + ${m.property.thumbGradient}) : ('background: ' + ${m.property.thumbGradient})"></div>
                <div>
                    <div class="small text-muted" th:text="#{brokerMsg.sharedListing}">Shared a listing</div>
                    <div class="fw-semibold" th:text="${m.property.title}">Listing title</div>
                    <div class="small text-muted" th:text="${m.property.locationLabel}">Colombo</div>
                    <div class="small fw-semibold" th:text="${m.property.priceFormatted}">8,200,000 LKR</div>
                </div>
            </a>

            <!-- Reply by email or phone -->
            <div class="small mt-2">
                <span class="text-muted" th:text="#{inbox.contactSender}">Contact sender:</span>
                <a th:href="'mailto:' + ${m.sender.email}" th:text="${m.sender.email}">mail</a>
                <span th:if="${m.sender.phoneNumber != null and !#strings.isEmpty(m.sender.phoneNumber)}">
                    &middot; <a th:href="'tel:' + ${m.sender.phoneNumber}" th:text="${m.sender.phoneNumber}">011</a>
                </span>
            </div>
        </div>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(inboxMessages)}">
        <i class="bi bi-inbox"></i>
        <h4 th:text="#{inbox.empty}">No messages yet</h4>
        <p class="text-muted" th:text="#{inbox.emptyText}">When someone messages you or shares a listing, it will show up here.</p>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
