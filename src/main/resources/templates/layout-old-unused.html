<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script>
            (function () {
                const saved = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-bs-theme', saved);
            })();
        </script>
    </th:block>
</head>
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" th:href="@{/}">Ceylon Estates</a>

        <div class="ms-auto d-flex align-items-center gap-2">
            <span sec:authorize="isAnonymous()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" class="d-flex gap-2">
                <a th:href="@{/login}" class="btn btn-sm btn-outline-light" th:text="#{nav.login}">Login</a>
                <a th:href="@{/register}" class="btn btn-sm btn-accent" th:text="#{nav.register}">Sign up</a>
            </span>

            <button type="button"
                    class="btn btn-sm rounded-circle p-0 border-0"
                    style="width: 40px; height: 40px; overflow: hidden;"
                    data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-controls="appSidebar">
                <img th:if="${currentUser != null and currentUser.avatarFilename != null}"
                     th:src="@{'/uploads/avatars/' + ${currentUser.avatarFilename}}"
                     alt="Profile"
                     style="width: 100%; height: 100%; object-fit: cover;">
                <span th:unless="${currentUser != null and currentUser.avatarFilename != null}"
                      class="d-flex align-items-center justify-content-center bg-secondary text-white rounded-circle"
                      style="width: 100%; height: 100%; font-size: 18px;">👤</span>
            </button>
        </div>
    </nav>
</div>

<div th:fragment="sidebar">
    <div class="offcanvas offcanvas-end" tabindex="-1" id="appSidebar" aria-labelledby="appSidebarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="appSidebarLabel" th:text="#{sidebar.title}">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="list-group">
                <span sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <a class="list-group-item list-group-item-action" th:href="@{/profile}" th:text="#{sidebar.userManagement}">User Management</a>
                </span>
                <span sec:authorize="isAnonymous()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                    <a class="list-group-item list-group-item-action" th:href="@{/login}" th:text="#{sidebar.userManagement}">User Management</a>
                </span>
                <a class="list-group-item list-group-item-action" th:href="@{/settings}" th:text="#{sidebar.appSettings}">App Settings</a>
            </div>
        </div>
    </div>
</div>

<div th:fragment="footer">
    <footer class="text-center text-muted small py-4 mt-5 border-top">
        <p th:text="#{footer.text}">Ceylon Estates, coursework project</p>
    </footer>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/auth.js}"></script>
</th:block>

</body>
</html>
