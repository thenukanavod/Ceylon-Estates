<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Verify Login</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 420px; margin-top: 50px; margin-bottom: 50px;">
        <h1 class="mb-3" th:text="#{verify.title}">Verify your login</h1>
        <p class="text-muted" th:text="#{verify.description}"></p>

        <div class="alert alert-success" th:if="${resent}" th:text="#{verify.resent}"></div>
        <div class="alert alert-warning" th:if="${emailFailed}" th:text="#{verify.emailFailed}">We could not send the email.</div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/verify-2fa}" method="post">
            <div class="mb-3">
                <label class="form-label" th:text="#{verify.code}">Verification code</label>
                <input type="text" name="code" class="form-control form-control-lg text-center font-monospace" maxlength="12" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" autofocus>
                <div class="form-text" th:text="#{verify.backupHint}">Lost access to your email? Enter one of your backup codes here instead.</div>
            </div>
            <button type="submit" class="btn btn-dark w-100" th:text="#{verify.submit}">Verify</button>
        </form>

        <form th:action="@{/resend-2fa-code}" method="post" class="mt-3">
            <button type="submit" class="btn btn-link p-0" th:text="#{verify.resend}">Resend code</button>
        </form>

        <p class="mt-3"><a th:href="@{/login}" th:text="#{verify.cancel}">Cancel and log in again</a></p>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
