<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>My listings</title>
</head>
<body>
<header th:replace="~{fragments/layout :: pageHero(#{mine.title}, #{mine.subtitle})}"></header>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="container-xl page-main">
    <div class="alert alert-success" th:if="${flash != null}" th:text="#{${flash}}">Done.</div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0" th:text="#{mine.heading}">Your listings</h4>
        <a th:href="@{/sell}" class="btn btn-teal"><i class="bi bi-plus-lg"></i> <span th:text="#{mine.add}">New listing</span></a>
    </div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(listings)}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th th:text="#{mine.colTitle}">Title</th>
                <th th:text="#{mine.colType}">Type</th>
                <th th:text="#{mine.colPrice}">Price</th>
                <th th:text="#{mine.colStatus}">Status</th>
                <th th:text="#{mine.colViews}">Views</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${listings}">
                <td>
                    <a th:href="@{/properties/{id}(id=${p.id})}" class="fw-semibold text-decoration-none" th:text="${p.title}">Title</a>
                    <div class="small text-muted" th:text="${p.locationLabel}">Colombo</div>
                    <div class="small text-danger" th:if="${p.status.name() == 'REJECTED' and p.rejectionReason != null}" th:text="${p.rejectionReason}"></div>
                </td>
                <td th:text="#{${p.tagMessageKey}}">HOUSE</td>
                <td><span th:text="${p.priceFormatted}">0</span> <span class="small text-muted" th:text="#{${p.priceNoteKey}}"></span></td>
                <td><span class="badge" th:classappend="${p.status.badgeClass}" th:text="${p.status.label}">Pending</span></td>
                <td th:text="${p.viewCount}">0</td>
                <td class="text-end">
                    <div class="d-inline-flex gap-1 table-actions">
                        <a th:href="@{/my-listings/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> <span th:text="#{common.edit}">Edit</span></a>
                        <form th:action="@{/my-listings/{id}/duplicate(id=${p.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary" th:title="#{mine.duplicate}"><i class="bi bi-copy"></i></button>
                        </form>
                        <form th:action="@{/my-listings/{id}/complete(id=${p.id})}" method="post" th:if="${p.status.live}">
                            <button type="submit" class="btn btn-sm btn-outline-success"
                                    th:text="${p.forRent} ? #{mine.markRented} : #{mine.markSold}">Mark sold</button>
                        </form>
                        <form th:action="@{/my-listings/{id}/delete(id=${p.id})}" method="post"
                              th:attr="onsubmit='return confirm(\'' + #{mine.confirmDelete} + '\');'">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(listings)}">
        <i class="bi bi-house-add"></i>
        <h4 th:text="#{mine.emptyTitle}">No listings yet</h4>
        <p class="text-muted" th:text="#{mine.emptyText}">List your first property.</p>
        <a th:href="@{/sell}" class="btn btn-teal" th:text="#{mine.add}">New listing</a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
