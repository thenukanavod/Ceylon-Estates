<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Manage local info</title>
</head>
<body>
<header th:replace="~{fragments/layout :: pageHero(#{adminInfo.title}, #{adminInfo.subtitle})}"></header>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="container-xl page-main">
    <div th:replace="~{admin/fragments :: tabs('localinfo')}"></div>
    <div class="alert alert-success" th:if="${flash != null}" th:text="#{${flash}}">Done.</div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0"><span th:text="#{adminInfo.heading}">District guides</span> <span class="badge text-bg-secondary" th:text="${#lists.size(items)}">0</span></h4>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/local-info/import}" class="btn btn-outline-secondary"><i class="bi bi-upload"></i> <span th:text="#{infoImport.button}">Import CSV</span></a>
            <a th:href="@{/admin/local-info/new}" class="btn btn-teal"><i class="bi bi-plus-lg"></i> <span th:text="#{adminInfo.add}">Add guide</span></a>
        </div>
    </div>
    <div class="table-responsive">
        <table class="table align-middle">
            <thead><tr>
                <th th:text="#{brokerForm.district}">District</th><th th:text="#{info.schools}">Schools</th>
                <th th:text="#{info.transport}">Transport</th><th th:text="#{adminInfo.pets}">Pets</th><th></th>
            </tr></thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td class="fw-semibold" th:text="${i.district.label}">Colombo</td>
                <td th:text="${i.schoolRating} + ' / 5'">3 / 5</td>
                <td th:text="${i.transportRating} + ' / 5'">3 / 5</td>
                <td><i class="bi" th:classappend="${i.petFriendlyRentalsCommon} ? 'bi-check-circle-fill text-success' : 'bi-dash-circle text-muted'"></i></td>
                <td class="text-end"><div class="d-inline-flex gap-1 table-actions">
                    <a th:href="@{/admin/local-info/{id}/edit(id=${i.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> <span th:text="#{common.edit}">Edit</span></a>
                    <form th:action="@{/admin/local-info/{id}/delete(id=${i.id})}" method="post"
                          th:attr="onsubmit='return confirm(\'' + #{mine.confirmDelete} + '\');'">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </form></div></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
