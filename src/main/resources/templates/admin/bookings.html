<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Viewing bookings</title>
</head>
<body>
<header th:replace="~{fragments/layout :: pageHero(#{adminBookings.title}, #{adminBookings.subtitle})}"></header>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="container-xl page-main">
    <div th:replace="~{admin/fragments :: tabs('bookings')}"></div>
    <div class="alert alert-success" th:if="${flash != null}" th:text="#{${flash}}">Done.</div>
    <div class="alert alert-danger" th:if="${flashError != null}" th:text="#{${flashError}}">Error.</div>

    <div class="table-responsive" th:if="${!#lists.isEmpty(bookings)}">
        <table class="table align-middle">
            <thead>
            <tr>
                <th th:text="#{booking.colProperty}">Property</th>
                <th th:text="#{adminBookings.colBuyer}">Buyer</th>
                <th th:text="#{booking.colWhen}">Visit</th>
                <th th:text="#{booking.colStatus}">Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td>
                    <a th:href="@{/properties/{id}(id=${b.property.id})}" class="fw-semibold text-decoration-none" th:text="${b.property.title}">Title</a>
                    <div class="small text-muted" th:text="${b.property.locationLabel}">Colombo</div>
                </td>
                <td>
                    <div th:text="${b.user.username}">buyer</div>
                    <div class="small"><i class="bi bi-telephone-fill"></i> <span th:text="${b.phone}">077</span></div>
                    <div class="small text-muted fst-italic" th:if="${b.note != null}" th:text="${b.note}">note</div>
                </td>
                <td th:text="${#temporals.format(b.visitAt, 'EEE d MMM yyyy, HH:mm')}">Mon 12 Oct 2026, 10:00</td>
                <td><span class="badge" th:classappend="'text-bg-' + ${b.status.badgeClass}" th:text="${b.status.label}">Requested</span></td>
                <td class="text-end">
                    <div class="d-inline-flex gap-1 table-actions">
                        <form th:action="@{/admin/bookings/{id}/confirm(id=${b.id})}" method="post" th:if="${b.status.name() != 'CONFIRMED'}">
                            <button type="submit" class="btn btn-sm btn-outline-success"><i class="bi bi-check-lg"></i> <span th:text="#{adminBookings.confirm}">Confirm</span></button>
                        </form>
                        <form th:action="@{/admin/bookings/{id}/decline(id=${b.id})}" method="post" th:if="${b.status.name() != 'DECLINED'}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-x-lg"></i> <span th:text="#{adminBookings.decline}">Decline</span></button>
                        </form>
                        <form th:action="@{/admin/bookings/{id}/delete(id=${b.id})}" method="post"
                              th:attr="onsubmit='return confirm(\'' + #{mine.confirmDelete} + '\');'">
                            <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{common.delete}"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${#lists.isEmpty(bookings)}">
        <i class="bi bi-calendar-check"></i>
        <h4 th:text="#{adminBookings.emptyTitle}">No booking requests</h4>
        <p class="text-muted" th:text="#{adminBookings.emptyText}">Viewing requests from buyers appear here.</p>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
