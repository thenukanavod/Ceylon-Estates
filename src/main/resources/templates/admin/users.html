<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Users</title>
</head>
<body>
<header th:replace="~{fragments/layout :: pageHero(#{adminUsers.title}, #{adminUsers.subtitle})}"></header>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="container-xl page-main">
    <div th:replace="~{admin/fragments :: tabs('users')}"></div>
    <div class="alert alert-success" th:if="${flash != null}" th:text="#{${flash}}">Done.</div>
    <div class="alert alert-danger" th:if="${flashError != null}" th:text="#{${flashError}}">Not allowed.</div>

    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/admin/users/new}" class="btn btn-teal"><i class="bi bi-person-plus"></i> <span th:text="#{adminUsers.new.button}">Create admin account</span></a>
    </div>

    <form th:action="@{/admin/users}" method="get" class="big-search mb-4">
        <input type="text" name="q" th:value="${q}" th:placeholder="#{adminUsers.search}">
        <button type="submit"><i class="bi bi-search"></i></button>
    </form>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead><tr>
                <th th:text="#{adminUsers.colUser}">User</th>
                <th th:text="#{adminUsers.colRole}">Role</th>
                <th th:text="#{adminUsers.col2fa}">2FA</th>
                <th th:text="#{adminUsers.colSignIn}">Sign-in</th>
                <th></th>
            </tr></thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td>
                    <div class="fw-semibold"><span th:text="${u.username}">name</span>
                        <span class="badge text-bg-light border" th:if="${u.username == me}" th:text="#{adminUsers.you}">You</span></div>
                    <div class="small text-muted" th:text="${u.email}">mail</div>
                </td>
                <td><span class="badge" th:classappend="${u.role == 'ADMIN'} ? 'text-bg-dark' : 'text-bg-secondary'" th:text="${u.role}">USER</span></td>
                <td><i class="bi" th:classappend="${u.twoFaEnabled} ? 'bi-shield-check text-success' : 'bi-shield-x text-muted'"></i></td>
                <td class="small" th:text="${u.oauthProvider != null} ? ${u.oauthProvider} : #{adminUsers.password}">Password</td>
                <td class="text-end">
                    <div class="d-inline-flex gap-1 table-actions" th:if="${u.username != me}">
                        <form th:action="@{/admin/users/{id}/promote(id=${u.id})}" method="post" th:if="${u.role != 'ADMIN'}"
                              th:attr="onsubmit='return confirm(\'' + #{adminUsers.confirmPromote} + '\');'">
                            <button type="submit" class="btn btn-sm btn-outline-dark"><i class="bi bi-arrow-up-circle"></i> <span th:text="#{adminUsers.makeAdmin}">Make admin</span></button>
                        </form>
                        <form th:action="@{/admin/users/{id}/demote(id=${u.id})}" method="post" th:if="${u.role == 'ADMIN'}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-down-circle"></i> <span th:text="#{adminUsers.removeAdmin}">Remove admin</span></button>
                        </form>
                        <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                              th:attr="onsubmit='return confirm(\'' + #{adminUsers.confirmDelete} + '\');'">
                            <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted small" th:text="#{adminUsers.note}">Admins cannot change their own role or delete themselves, and the last admin can never be removed.</p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
