<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>Message</title>
</head>
<body>
<header th:replace="~{fragments/layout :: pageHero(#{adminMessages.title}, ${message.subject})}"></header>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="container-xl page-main" style="max-width: 900px;">
    <div th:replace="~{admin/fragments :: tabs('messages')}"></div>
    <div class="alert alert-success" th:if="${flash != null}" th:text="#{${flash}}">Done.</div>
    <div class="alert alert-danger" th:if="${flashError != null}" th:text="#{${flashError}}">Error.</div>

    <a th:href="@{/admin/messages}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> <span th:text="#{adminMessages.back}">Back to inbox</span></a>

    <div class="side-card mt-3">
        <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
            <div>
                <div class="fw-bold" th:text="${message.name}">Name</div>
                <a th:href="'mailto:' + ${message.email}" th:text="${message.email}">mail</a>
                <span th:if="${message.phone != null}"> &middot; <a th:href="'tel:' + ${message.phone}" th:text="${message.phone}">011</a></span>
            </div>
            <div class="text-end">
                <span class="badge" th:classappend="${message.status.badgeClass}" th:text="${message.status.label}">New</span>
                <div class="small text-muted" th:text="${#temporals.format(message.createdAt, 'd MMM yyyy, HH:mm')}">1 Oct</div>
            </div>
        </div>
        <h5 class="fw-bold" th:text="${message.subject}">Subject</h5>
        <div class="msg-body" th:text="${message.message}">Message</div>
    </div>

    <div class="side-card" th:if="${message.replied}">
        <div class="small text-muted mb-2" th:text="#{adminMessages.repliedBy(${message.repliedBy}, ${#temporals.format(message.repliedAt, 'd MMM yyyy, HH:mm')})}">Replied</div>
        <div class="msg-body reply" th:text="${message.adminReply}">Reply</div>
    </div>

    <form class="side-card" th:action="@{/admin/messages/{id}/reply(id=${message.id})}" method="post">
        <h6 class="fw-bold" th:text="${message.replied} ? #{adminMessages.replyAgain} : #{adminMessages.replyTitle}">Reply by email</h6>
        <p class="small text-muted" th:text="#{adminMessages.replyHint(${message.email})}">This is sent to the visitor's email.</p>
        <textarea name="reply" class="form-control mb-3" rows="6" maxlength="2000" required th:placeholder="#{adminMessages.replyPlaceholder}"></textarea>
        <button type="submit" class="btn btn-teal"><i class="bi bi-send"></i> <span th:text="#{adminMessages.send}">Send reply</span></button>
    </form>

    <div class="d-flex gap-2 table-actions">
        <form th:action="@{/admin/messages/{id}/status(id=${message.id})}" method="post">
            <input type="hidden" name="value" value="NEW">
            <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{adminMessages.markUnread}">Mark as unread</button>
        </form>
        <form th:action="@{/admin/messages/{id}/status(id=${message.id})}" method="post">
            <input type="hidden" name="value" value="ARCHIVED">
            <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{adminMessages.archive}">Archive</button>
        </form>
        <form th:action="@{/admin/messages/{id}/delete(id=${message.id})}" method="post"
              th:attr="onsubmit='return confirm(\'' + #{mine.confirmDelete} + '\');'">
            <button type="submit" class="btn btn-outline-danger btn-sm" th:text="#{common.delete}">Delete</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
