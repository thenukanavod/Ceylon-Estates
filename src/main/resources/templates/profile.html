<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <title>User Management</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="container" style="max-width: 760px; margin-top: 50px; margin-bottom: 50px;">

        <div class="alert alert-danger" th:if="${avatarError}" th:text="${avatarError}"></div>
        <div class="alert alert-success" th:if="${param.passwordChanged}" th:text="#{profile.passwordChanged}"></div>

        <h1 class="mb-4" th:text="#{sidebar.userManagement}">User Management</h1>

        <!-- Avatar row -->
        <div class="setting-row">
            <div class="d-flex align-items-center gap-3">
                <img th:if="${user.avatarFilename}"
                     th:src="@{'/uploads/avatars/' + ${user.avatarFilename}}"
                     alt="Profile picture"
                     class="rounded-circle"
                     style="width: 56px; height: 56px; object-fit: cover;">
                <div th:unless="${user.avatarFilename}"
                     class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white"
                     style="width: 56px; height: 56px; font-size: 22px;">
                    <span th:text="${#strings.substring(user.username, 0, 1)}">?</span>
                </div>
                <div>
                    <div class="setting-label" th:text="${user.username}">username</div>
                    <div class="setting-hint" th:text="${user.email}">email</div>
                </div>
            </div>
            <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data">
                <input type="file" id="avatarInput" name="avatar" accept="image/png, image/jpeg, image/webp" class="d-none">
                <button type="button" class="btn btn-accent" id="avatarPickBtn" th:text="#{profile.changePhoto}">Change photo</button>
            </form>
        </div>

        <!-- Edit profile row -->
        <div class="setting-row">
            <div>
                <div class="setting-label" th:text="#{profile.editProfile}">Edit profile</div>
                <div class="setting-hint" th:text="#{profile.editProfileHint}">Update your details</div>
            </div>
            <a th:href="@{/profile/edit}" class="btn btn-accent" th:text="#{profile.edit}">Edit</a>
        </div>

        <!-- Change password row -->
        <div class="setting-row">
            <div>
                <div class="setting-label" th:text="#{profile.changePassword}">Change password</div>
                <div class="setting-hint" th:text="#{profile.changePasswordHint}">Update your password</div>
            </div>
            <a th:href="@{/profile/change-password}" class="btn btn-accent" th:text="#{profile.change}">Change</a>
        </div>

        <!-- Admin row (only visible to admins) -->
        <div class="setting-row" sec:authorize="hasRole('ADMIN')" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
            <div>
                <div class="setting-label" th:text="#{profile.adminDashboard}">Admin dashboard</div>
                <div class="setting-hint" th:text="#{profile.adminDashboardHint}">View site stats</div>
            </div>
            <a th:href="@{/admin}" class="btn btn-accent" th:text="#{profile.open}">Open</a>
        </div>

        <!-- Logout row -->
        <div class="setting-row">
            <div>
                <div class="setting-label" th:text="#{profile.logout}">Logout</div>
                <div class="setting-hint" th:text="#{profile.logoutHint}">Sign out of this device</div>
            </div>
            <a th:href="@{/logout-confirm}" class="btn btn-accent" th:text="#{profile.logout}">Logout</a>
        </div>

        <!-- Delete account row -->
        <div class="setting-row border border-danger-subtle">
            <div>
                <div class="setting-label text-danger" th:text="#{profile.deleteAccount}">Delete my account</div>
                <div class="setting-hint" th:text="#{profile.deleteAccountHint}">Cannot be undone</div>
            </div>
            <form th:action="@{/profile/delete}" method="post" onsubmit="return confirm('Are you sure? This permanently deletes your account and cannot be undone.');">
                <button type="submit" class="btn btn-accent" th:text="#{profile.delete}">Delete</button>
            </form>
        </div>

    </main>


    <!-- Crop / resize dialog for the profile picture -->
    <div class="modal fade" id="avatarCropModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{profile.cropTitle}">Adjust your photo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <canvas id="avatarCropCanvas" width="300" height="300"
                            style="width: 300px; max-width: 100%; border-radius: 50%; cursor: grab; touch-action: none; background: #ddd;"></canvas>
                    <div class="small text-muted mt-2" th:text="#{profile.cropHint}">Drag to move, use the slider to zoom.</div>
                    <input type="range" id="avatarCropZoom" class="form-range mt-2" min="1" max="3" step="0.01" value="1">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{profile.cropCancel}">Cancel</button>
                    <button type="button" class="btn btn-accent" id="avatarCropSave" th:text="#{profile.cropSave}">Save photo</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script th:src="@{/js/avatar-crop.js}"></script>
</body>
</html>
