home.sell.body=ඔබේ දේපළ Ceylon Estates සමඟ ලැයිස්තුගත කර, දිවයින පුරා සිටින සත්‍යාපිත ගැනුම්කරුවන්, නියෝජිතයන් සහ උකස් තැරැව්කරුවන් දහස් ගණනකට ඉදිරිපත් කරන්න \u2014 විකිණෙන තෙක් ලැයිස්තු ගාස්තු අය නොකෙරේ.
