home.faq.heading=නිතර අසන ප්‍රශ්න
home.faq.body=Ceylon Estates යනු ශ්‍රී ලංකාවේ ඉඩම්, නිවාස සහ මහල් නිවාස සඳහා විශ්වාසනීය මූලාශ්‍රයයි. ගැනුම්කරුවන් සහ විකුණුම්කරුවන් වැඩිපුරම අසන ප්‍රශ්නවලට පිළිතුරු මෙන්න.
home.faq.q1=ඔබ ශ්‍රී ලංකාවේ කුමන ප්‍රදේශ ආවරණය කරනවාද?
home.faq.a1=කොළඹ සිට යාපනය දක්වා පළාත් නවයම ආවරණය කරමින් අපි ඉඩම්, නිවාස සහ මහල් නිවාස ලැයිස්තුගත කරමු.
home.faq.q2=Ceylon Estates සමඟ මගේ දේපළ ලැයිස්තුගත කිරීම නොමිලේද?
home.faq.a2=ඔව් \u2014 ලැයිස්තුගත කිරීම සම්පූර්ණයෙන්ම නොමිලේ වන අතර, ඔබේ දේපළ විකිණෙන තෙක් අපි කොමිස් මුදලක් අය නොකරමු.
home.faq.q3=උකස් තැරැව්කරුවෙකු සොයා ගැනීමට ඔබට උදව් කළ හැකිද?
home.faq.a3=ඔව් \u2014 පළාතින් අපගේ ප්‍රාදේශීය උකස් තැරැව්කරුවන් පිරික්සා, මුල් පිටුවෙන්ම ඔබ අවට සිටින කෙනෙකු වෙත සම්බන්ධ වන්න.
home.faq.q4=ඔබ ඉඩම් සහ නිම කළ දේපළ දෙකම හසුරුවනවාද?
home.faq.a4=ඔව් \u2014 ඉදිකිරීමට හිස් ඉඩමක් වුවත්, නිම කළ නිවසක් වුවත්, නවීන මහල් නිවාසයක් වුවත්, අප සතුව තුනටම සත්‍යාපිත ලැයිස්තු තිබේ.
home.faq.q5=සත්‍යාපිත ලැයිස්තු ක්‍රියා කරන්නේ කෙසේද?
home.faq.a5=සෑම ලැයිස්තුවක්ම ප්‍රසිද්ධ කිරීමට පෙර අපගේ කණ්ඩායම විසින් පරීක්ෂා කරනු ලබන අතර, ඔබ දකින විස්තර, ඡායාරූප සහ මිල ගණන් නිවැරදි හා යාවත්කාලීන බව සහතික කරයි.

home.faqCta.heading=තවම ප්‍රශ්න තිබේද?
home.faqCta.body=ඔබ සොයන පිළිතුර සොයාගත නොහැකිද? අපගේ මිත්‍රශීලී කණ්ඩායම සමඟ කතා කරන්න.
