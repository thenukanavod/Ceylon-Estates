home.faq.heading=Frequently asked questions
home.faq.body=Ceylon Estates is Sri Lanka's trusted home for lands, houses and apartments. Here are answers to what buyers and sellers ask us most.
home.faq.q1=Which areas of Sri Lanka do you cover?
home.faq.a1=We list lands, houses and apartments across all nine provinces, from Colombo to Jaffna.
home.faq.q2=Is it free to list my property with Ceylon Estates?
home.faq.a2=Yes \u2014 listing is completely free, and we don't charge a commission until your property actually sells.
home.faq.q3=Can you help me find a mortgage broker?
home.faq.a3=Yes \u2014 browse our local mortgage brokers by province and reach out to one near you directly from the homepage.
home.faq.q4=Do you handle both lands and finished properties?
home.faq.a4=Yes \u2014 whether you're after a bare plot to build on, a ready house, or a modern apartment, we have verified listings for all three.
home.faq.q5=How do verified listings work?
home.faq.a5=Every listing is checked by our team before it goes live, so the details, photos and pricing you see are accurate and up to date.

home.faqCta.heading=Still have questions?
home.faqCta.body=Can't find the answer you're looking for? Chat with our friendly team.
home.faqCta.button=Get in Touch

